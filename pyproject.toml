[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fast-rag-chunker"
version = "0.3.0"
description = "Zero-copy PyO3 content-defined semantic & rolling-hash chunker"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[tool.maturin]
features = ["extension-module"]
module-name = "fast_rag_chunker"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

