[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fast-rag-chunker"
version = "0.1.0"
description = "Zero-copy PyO3 content-defined semantic & rolling-hash chunker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module", "python"]
module-name = "fast_rag_chunker"
