[package]
name = "fast-rag-chunker"
version = "0.1.0"
edition = "2021"
authors = ["mjlelis <mjlelis@users.noreply.github.com>"]
description = "Hybrid C/Rust/Python fast content-defined chunking (FastCDC) engine for RAG pipelines"

[lib]
name = "fast_rag_chunker"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
rayon = "1.10"
thiserror = "1.0"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.5"
