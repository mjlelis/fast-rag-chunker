[package]
name = "fast-rag-chunker"
version = "0.3.0"
edition = "2021"
authors = ["mjlelis <mjlelis@users.noreply.github.com>"]
description = "Hybrid C/Rust/Python fast content-defined chunking (FastCDC) engine for RAG pipelines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjlelis/fast-rag-chunker"

[lib]
name = "fast_rag_chunker"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
blake3 = "1.5"
pyo3 = { version = "0.24", optional = true }
rayon = "1.10"
thiserror = "1.0"
unicode-normalization = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "throughput"
harness = false
